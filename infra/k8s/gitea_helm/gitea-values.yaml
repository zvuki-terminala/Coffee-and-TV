global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  hostAliases: []

namespace: ""

replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: "100%"
    maxUnavailable: 0

clusterDomain: cluster.local

image:
  registry: "docker.gitea.com"
  repository: gitea
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  rootless: true
  fullOverride: ""

imagePullSecrets: []

openshift:
  enabled: null
  hostUsers: null

podSecurityContext: {}

containerSecurityContext: {}

service:
  http:
    type: ClusterIP
    port: 3000
    clusterIP: ""
    loadBalancerIP:
    nodePort:
    externalTrafficPolicy:
    externalIPs:
    ipFamilyPolicy:
    ipFamilies:
    loadBalancerSourceRanges: []
    annotations: {}
    labels: {}
    loadBalancerClass:

  ssh:
    type: LoadBalancer
    port: 22
    nodePort: 30022
    clusterIP: ""
    loadBalancerIP:
    externalTrafficPolicy:
    externalIPs:
    ipFamilyPolicy:
    ipFamilies:
    hostPort:
    loadBalancerSourceRanges: []
    annotations: {}
    labels: {}
    loadBalancerClass:

ingress:
  enabled: true
  className: nginx
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: git.dev.local
      paths:
        - path: /
  tls:
    - secretName: dev-local-tls
      hosts:
        - git.dev.local

gatewayAPI:
  enabled: false

route:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "4"
    memory: 8Gi

schedulerName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
dnsConfig: {}
priorityClassName: ""

deployment:
  env: []
  terminationGracePeriodSeconds: 60
  labels: {}
  annotations: {}

serviceAccount:
  create: false
  name: ""
  automountServiceAccountToken: false
  imagePullSecrets: []
  annotations: {}
  labels: {}

persistence:
  enabled: true
  create: true
  mount: true
  claimName: gitea-shared-storage
  size: 20Gi
  accessModes:
    - ReadWriteOnce
  labels: {}
  storageClass: ""
  subPath:
  volumeName: ""
  annotations:
    helm.sh/resource-policy: keep

extraContainers: []
preExtraInitContainers: []
postExtraInitContainers: []
extraVolumes: []
extraContainerVolumeMounts: []
extraInitVolumeMounts: []
extraVolumeMounts: []

initPreScript: ""
initContainersScriptsVolumeMountPath: "/usr/sbinx"
initContainers:
  resources:
    limits: {}
    requests:
      cpu: 200m
      memory: 256Mi

signing:
  enabled: false
  gpgHome: /data/git/.gnupg
  privateKey: ""
  existingSecret: ""

gitea:
  admin:
    username: admin
    password: "adminpassword"
    email: "admin@dev.local"
    passwordMode: keepUpdated
    existingSecret:
  metrics:
    enabled: false
    token:
    serviceMonitor:
      enabled: false
      interval: ""
      relabelings: []
      scheme: ""
      scrapeTimeout: ""
      tlsConfig: {}
  ldap: []
  oauth: []
  config:
    server:
      DOMAIN: git.dev.local
      ROOT_URL: https://git.dev.local/
      PROTOCOL: http
      HTTP_PORT: 3000
      SSH_LISTEN_PORT: 22
      SSH_PORT: 30022
    database:
      DB_TYPE: postgres
      HOST: gitea-postgresql:5432
      NAME: gitea
      USER: gitea
      PASSWD: gitea
    service:
      DISABLE_REGISTRATION: false
      REQUIRE_SIGNIN_VIEW: false
      REGISTER_EMAIL_CONFIRM: false
      ENABLE_NOTIFY_MAIL: false
      ALLOW_ONLY_EXTERNAL_REGISTRATION: false
      ENABLE_CAPTCHA: false
      DEFAULT_KEEP_EMAIL_PRIVATE: false
      DEFAULT_ALLOW_CREATE_ORGANIZATION: true
      DEFAULT_ENABLE_TIMETRACKING: true
      NO_REPLY_ADDRESS: noreply.dev.local
      DEFAULT_USER_IS_RESTRICTED: true
    repository:
      DEFAULT_BRANCH: master
    actions:
      ENABLED: true
  additionalConfigSources: []
  additionalConfigFromEnvs: []
  extraEnvSourceFile:
  podAnnotations: {}
  ssh:
    logLevel: "INFO"
  livenessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 200
    timeoutSeconds: 1
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 10
  readinessProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    timeoutSeconds: 1
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  startupProbe:
    enabled: false
    tcpSocket:
      port: http
    initialDelaySeconds: 60
    timeoutSeconds: 1
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 10

valkey-cluster:
  enabled: false

valkey:
  enabled: true
  architecture: standalone
  kubectl:
    image:
      repository: bitnamilegacy/kubectl
  image:
    repository: bitnamilegacy/valkey
  global:
    valkey:
      password: secretpassword
  master:
    count: 1
    service:
      ports:
        valkey: 6379
  metrics:
    image:
      repository: bitnamilegacy/redis-exporter
  primary:
    persistence:
      enabled: true
      storageClass: ""
      size: 4Gi
  replica:
    persistence:
      enabled: false
      storageClass: ""
      size: 4Gi
  sentinel:
    image:
      repository: bitnamilegacy/valkey-sentinel
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

postgresql-ha:
  enabled: false


postgresql:
  enabled: true
  global:
    postgresql:
      auth:
        username: gitea
        database: gitea
        password: gitea
  image:
    repository: bitnamilegacy/postgresql
  primary:
    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi
  readReplicas:
    persistence:
      enabled: false
      storageClass: ""
      size: ""
  metrics:
    image:
      repository: bitnamilegacy/postgres-exporter
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

checkDeprecation: true
test:
  enabled: true
  image:
    name: busybox
    tag: latest

extraDeploy: []